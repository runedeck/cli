name: Secret Scan

# Weekly full-history sweep on the hosted runner, complementing the
# per-push range scan. A marker issue records the last swept commit, so
# an unchanged repository costs one API read. Findings never enter the
# issue body or leave the runner; the owner reproduces them locally
# with `gitleaks git`.
on:
    schedule:
        - cron: "41 3 * * 1"
    workflow_dispatch: {}

permissions:
    contents: read
    issues: write

concurrency:
    group: secret-scan
    cancel-in-progress: false

env:
    GITLEAKS_VERSION: "8.30.1"
    MARKER_TITLE: "Full-history secret scan"

jobs:
    sweep:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
            - env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -o pipefail
                  head=$(git rev-parse HEAD)
                  # Only the workflow's own closed marker suppresses a sweep: a
                  # title-forged issue or an open (dirty) marker never skips.
                  marker=$(gh api --paginate "repos/${{ github.repository }}/issues?state=all&per_page=100" \
                      --jq '[.[] | select(.pull_request | not) | select(.user.login == "github-actions[bot]") | select(.title == env.MARKER_TITLE)]' \
                      | jq -s -r 'add // [] | first // empty | "\(.number)\t\(.state)\t\(.body // "" | split("\n") | first)"') || marker=""
                  number=$(printf '%s' "$marker" | cut -f1)
                  marker_state=$(printf '%s' "$marker" | cut -f2)
                  swept=$(printf '%s' "$marker" | cut -f3- | grep -oE '^swept: [0-9a-f]{40}' | cut -d' ' -f2 || true)
                  if [ -n "$number" ] && [ "$marker_state" = "closed" ] && [ "$swept" = "$head" ]; then
                      echo "history unchanged since the last clean sweep."
                      exit 0
                  fi
                  curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
                  sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
                  tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
                  sudo install gitleaks /usr/local/bin/gitleaks
                  # Finding metadata stays off the public run log; the sweep
                  # reports only its outcome.
                  set +e
                  gitleaks git --no-banner --redact --exit-code 9 . >/dev/null 2>&1
                  scan=$?
                  set -e
                  if [ "$scan" -eq 0 ]; then
                      body="swept: $head"$'\n\n'"The full history is clean."
                      state="closed"
                      outcome=0
                  elif [ "$scan" -eq 9 ]; then
                      body="swept: $head"$'\n\n'"gitleaks reports findings in the full history; reproduce locally with \`gitleaks git\`."
                      state="open"
                      outcome=1
                  else
                      echo "gitleaks failed before scanning completed; the marker is left untouched."
                      exit "$scan"
                  fi
                  if [ -n "$number" ]; then
                      gh api -X PATCH "repos/${{ github.repository }}/issues/$number" \
                          -f body="$body" -f state="$state" >/dev/null
                  else
                      created=$(gh api -X POST "repos/${{ github.repository }}/issues" \
                          -f title="$MARKER_TITLE" -f body="$body" --jq .number)
                      [ "$state" = "closed" ] && gh api -X PATCH "repos/${{ github.repository }}/issues/$created" -f state=closed >/dev/null
                  fi
                  exit "$outcome"
