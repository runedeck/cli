name: Template Update

on:
    repository_dispatch:
        types: [template-released]
    schedule:
        - cron: "17 5 * * 3"
    workflow_dispatch: {}

permissions:
    actions: read
    contents: read
    pull-requests: read

concurrency:
    group: template-update
    cancel-in-progress: false

jobs:
    update:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  ref: main

            - name: Install Copier
              run: |
                  . scripts/tool-versions
                  pipx install "copier==$COPIER_VERSION"

            - id: detect
              name: Detect template release
              env:
                  DISPATCH_TAG: ${{ github.event.client_payload.tag }}
                  DISPATCH_TEMPLATE: ${{ github.event.client_payload.template }}
              run: |
                  result=$(copier check-update --answers-file answers.yaml --output-format json)
                  update=$(printf '%s' "$result" | jq -r '.update_available')
                  latest=$(printf '%s' "$result" | jq -r '.latest_version')
                  target=$latest
                  recorded_source=$(grep -E '^_src_path:' answers.yaml | sed 's/^_src_path:[[:space:]]*//')
                  recorded_commit=$(grep -E '^_commit:' answers.yaml | sed 's/^_commit:[[:space:]]*//')
                  fetch_url=$recorded_source
                  case "$fetch_url" in gh:*) fetch_url="https://github.com/${fetch_url#gh:}" ;; esac

                  if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
                      printf '%s' "$DISPATCH_TEMPLATE" \
                          | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' \
                          || { echo "invalid template repository: $DISPATCH_TEMPLATE"; exit 1; }
                      # A dispatch for another template must not advance this
                      # repository. The recorded source's owner/repo tail
                      # compares across https, ssh, gh:, and .git spellings.
                      source_repo=$(printf '%s' "$recorded_source" | sed -E 's/\.git$//; s|^.*[:/]([^/:]+/[^/:]+)$|\1|')
                      [ "$source_repo" = "$DISPATCH_TEMPLATE" ] \
                          || { echo "dispatch names template $DISPATCH_TEMPLATE, but this repository adopted $recorded_source"; exit 1; }
                      git check-ref-format "refs/tags/$DISPATCH_TAG" \
                          || { echo "invalid template release tag: $DISPATCH_TAG"; exit 1; }
                      dispatch_version=${DISPATCH_TAG#v}
                      [ "$latest" = "$DISPATCH_TAG" ] || [ "$latest" = "$dispatch_version" ] \
                          || { echo "release dispatch $DISPATCH_TAG is superseded by $latest"; exit 1; }
                      target=$DISPATCH_TAG
                  fi

                  # Copier reports bare versions while release tags may carry a
                  # v prefix; the template's own tag list settles the form. A
                  # template with no tag past the recorded pin reports a
                  # post-release version (0.0.0.postN+sha): the target is then
                  # the commit of skeleton main, and the update pins that commit.
                  if [ "$update" = "true" ]; then
                      case "$target" in
                          *.post*+*)
                              resolved=$(git ls-remote "$fetch_url" refs/heads/main | cut -f1) \
                                  || { echo "could not read main on $recorded_source"; exit 1; }
                              [ -n "$resolved" ] \
                                  || { echo "no main branch on $recorded_source"; exit 1; }
                              ;;
                          *)
                              bare=${target#v}
                              listing=$(git ls-remote --tags "$fetch_url" "refs/tags/v$bare" "refs/tags/$bare") \
                                  || { echo "could not list release tags on $recorded_source"; exit 1; }
                              resolved=$(printf '%s\n' "$listing" \
                                  | grep -v '\^{}' | head -n 1 | sed 's|.*refs/tags/||')
                              [ -n "$resolved" ] \
                                  || { echo "no release tag for $target on $recorded_source"; exit 1; }
                              ;;
                      esac
                      target=$resolved
                  fi

                  # Copier compares tags only. A consumer pinned to a commit
                  # past the latest tag (a `v0.1.0-3-gabc1234` describe string
                  # or a bare hash) sees no tag update while skeleton main
                  # moves on, so main is compared by hand.
                  if [ "$update" != "true" ] && [ "${{ github.event_name }}" != "repository_dispatch" ]; then
                      case "$recorded_commit" in
                          *-g[0-9a-f]*) pinned_hash=${recorded_commit##*-g} ;;
                          *) pinned_hash=$recorded_commit ;;
                      esac
                      if printf '%s' "$pinned_hash" | grep -Eq '^[0-9a-f]{7,40}$'; then
                          main_sha=$(git ls-remote "$fetch_url" refs/heads/main | cut -f1) \
                              || { echo "could not read main on $recorded_source"; exit 1; }
                          case "$main_sha" in
                              "$pinned_hash"*) ;;
                              *) update=true; target=$main_sha ;;
                          esac
                      fi
                  fi

                  printf '%s\n' "update=$update" "tag=$target" \
                      | tee -a "$GITHUB_OUTPUT" >/dev/null

            - id: existing
              name: Find an open update
              if: steps.detect.outputs.update == 'true'
              run: |
                  # Updates publish as a patch artifact and a run summary; the
                  # owner applies the patch and pushes. Nothing opens a pull
                  # request, so there is no open update to look for.
                  printf 'url=\n' >> "$GITHUB_OUTPUT"

            - id: apply
              name: Apply template release
              if: steps.detect.outputs.update == 'true' && steps.existing.outputs.url == ''
              continue-on-error: true
              env:
                  TARGET_TAG: ${{ steps.detect.outputs.tag }}
              run: |
                  # Every path pins the detected release, so the applied tree
                  # always matches the tag the branch and pull request name.
                  copier update --answers-file answers.yaml --defaults --vcs-ref "$TARGET_TAG"

            - name: Reject unresolved update output
              if: steps.detect.outputs.update == 'true' && steps.existing.outputs.url == ''
              env:
                  APPLY_OUTCOME: ${{ steps.apply.outcome }}
              run: |
                  # A labeled begin or end marker is never legitimate text, so
                  # each blocks alone and a partially resolved conflict still
                  # fails; only a bare ======= is setext-ambiguous and passes.
                  conflicts=$(grep -RIlE --exclude-dir=.git --exclude-dir=.jj '^(<<<<<<< |>>>>>>> )' . || true)
                  rejects=$(find . -path ./.git -prune -o -path ./.jj -prune -o -type f -name '*.rej' -print)
                  if [ -n "$conflicts" ] || [ -n "$rejects" ]; then
                      [ -z "$conflicts" ] || printf '%s\n' "$conflicts"
                      [ -z "$rejects" ] || printf '%s\n' "$rejects"
                      echo "Copier left unresolved update output."
                      exit 1
                  fi
                  [ "$APPLY_OUTCOME" = "success" ] \
                      || { echo "Copier failed before producing reviewable conflicts."; exit 1; }

            - name: Stage template output
              if: steps.detect.outputs.update == 'true' && steps.existing.outputs.url == ''
              run: |
                  git add -A
                  if git diff --cached --quiet; then
                      echo "Copier reported an update but changed no files."
                      exit 1
                  fi

            - name: Install validation tools
              if: steps.detect.outputs.update == 'true' && steps.existing.outputs.url == ''
              run: bash scripts/install-tools

            - name: Validate updated repository
              if: steps.detect.outputs.update == 'true' && steps.existing.outputs.url == ''
              env:
                  RUFF_NO_CACHE: "true"
                  REQUIRE_GATES: "1"
              run: make validate

            - name: Build update patch
              if: steps.detect.outputs.update == 'true' && steps.existing.outputs.url == ''
              run: |
                  unstaged=$(git diff --name-only)
                  untracked=$(git ls-files --others --exclude-standard)
                  if [ -n "$unstaged" ] || [ -n "$untracked" ]; then
                      [ -z "$unstaged" ] || printf 'Validation modified:\n%s\n' "$unstaged"
                      [ -z "$untracked" ] || printf 'Validation created:\n%s\n' "$untracked"
                      exit 1
                  fi
                  git diff --cached --binary --output=template-update.patch

            - name: Upload update patch
              if: steps.detect.outputs.update == 'true'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: template-update-${{ github.run_id }}
                  path: template-update.patch
                  if-no-files-found: error

            # The summary is the handoff: the owner downloads the patch,
            # applies it in a jj workspace, validates, and pushes. Skeleton
            # propagation never opens a pull request per consumer.
            - name: Summarize the update
              if: steps.detect.outputs.update == 'true'
              env:
                  TARGET_REF: ${{ steps.detect.outputs.tag }}
                  RUN_ID: ${{ github.run_id }}
              run: |
                  # shellcheck disable=SC2016 # backticks are Markdown, not expansion
                  {
                      printf '## Template update ready\n\n'
                      printf 'Target: `%s`\n\n' "$TARGET_REF"
                      printf 'Changed files:\n\n```\n'
                      git diff --cached --stat
                      printf '```\n\nApply: download the `template-update-%s` artifact, then\n\n' "$RUN_ID"
                      printf '```sh\ngit apply --index template-update.patch\nmake validate\n```\n'
                  } >> "$GITHUB_STEP_SUMMARY"
