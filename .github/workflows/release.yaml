name: Release

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Signed tag to publish"
                required: true

permissions:
    contents: write
    id-token: write
    attestations: write
    pull-requests: read

concurrency:
    group: release-${{ inputs.tag }}
    cancel-in-progress: false

jobs:
    verify:
        runs-on: ubuntu-latest
        outputs:
            commit: ${{ steps.tag.outputs.commit }}
            object: ${{ steps.tag.outputs.object }}
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  ref: main

            - name: Verify release tag
              env:
                  RELEASE_TAG: ${{ inputs.tag }}
              run: bash scripts/verify-release-tag "$RELEASE_TAG"

            - id: tag
              name: Record verified tag
              env:
                  RELEASE_TAG: ${{ inputs.tag }}
              run: |
                  echo "commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" >> "$GITHUB_OUTPUT"
                  echo "object=$(git rev-parse "refs/tags/$RELEASE_TAG^{tag}")" >> "$GITHUB_OUTPUT"

    test:
        needs: verify
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  ref: ${{ needs.verify.outputs.commit }}

            - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
              with:
                  components: rustfmt, clippy

            - name: Install validation tools
              run: bash scripts/install-tools

            - name: Validate
              run: |
                  cargo fmt --all -- --check
                  cargo clippy --all-targets --all-features -- -D warnings
                  cargo test --all-features
                  bash scripts/validate.sh

    build:
        needs: [verify, test]
        permissions:
            contents: read
            id-token: write
            attestations: write
        strategy:
            matrix:
                include:
                    - target: x86_64-unknown-linux-musl
                      runner: ubuntu-latest
                      archive: rune-cli-linux-x86_64.tar.gz
                    - target: aarch64-apple-darwin
                      runner: macos-latest
                      archive: rune-cli-macos-aarch64.tar.gz
                    - target: x86_64-pc-windows-msvc
                      runner: windows-latest
                      archive: rune-cli-windows-x86_64.zip

        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  persist-credentials: false
                  ref: ${{ needs.verify.outputs.commit }}

            - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
              with:
                  targets: ${{ matrix.target }}

            - name: Install musl tools
              if: contains(matrix.target, 'musl')
              run: sudo apt-get install -y musl-tools

            - name: Build
              run: cargo build --release --target ${{ matrix.target }}

            - name: Package (unix)
              if: runner.os != 'Windows'
              env:
                  ARCHIVE: ${{ matrix.archive }}
                  TARGET: ${{ matrix.target }}
              run: tar czf "$ARCHIVE" -C "target/$TARGET/release" rune

            - name: Package (windows)
              if: runner.os == 'Windows'
              env:
                  ARCHIVE: ${{ matrix.archive }}
                  TARGET: ${{ matrix.target }}
              run: Compress-Archive -Path "target/$env:TARGET/release/rune.exe" -DestinationPath "$env:ARCHIVE"
              shell: pwsh

            - name: Attest archive
              uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
              with:
                  subject-path: ${{ matrix.archive }}

            - name: Upload artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: ${{ matrix.archive }}
                  path: ${{ matrix.archive }}

    release:
        needs: [verify, build]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  ref: ${{ needs.verify.outputs.commit }}

            - name: Download artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  path: dist
                  merge-multiple: true

            - name: Generate checksums
              working-directory: dist
              run: sha256sum rune-cli-* > SHA256SUMS

            - name: Compile release notes
              env:
                  GH_TOKEN: ${{ github.token }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  RELEASE_TAG: ${{ inputs.tag }}
              run: bash scripts/compile-release-notes "$RELEASE_TAG" > release-notes.md

            - name: Publish release
              env:
                  EXPECTED_TAG_OBJECT: ${{ needs.verify.outputs.object }}
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ inputs.tag }}
              run: |
                  remote_object=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)
                  [ "$remote_object" = "$EXPECTED_TAG_OBJECT" ] || {
                      printf 'fatal: remote %s changed after verification\n' "$RELEASE_TAG" >&2
                      exit 1
                  }
                  gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md dist/*
