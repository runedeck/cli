name: Quality

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: quality-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: read

env:
    GITLEAKS_VERSION: "8.30.1"

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  # The prek hooks execute code from the checked-out tree, which
                  # must never find a usable token in the git config.
                  persist-credentials: false

            # Third-party actions must be pinned to a full commit SHA;
            # first-party paths (./) and runedeck/* refs are exempt.
            - name: Action pinning
              run: |
                  # Comments are stripped before the SHA test so trailing
                  # text cannot fake a pin.
                  violations=$(grep -RnE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*["'\'']?[^./[:space:]"'\'']' .github/workflows 2>/dev/null \
                      | sed 's/[[:space:]]#.*$//' \
                      | grep -vE 'uses:[[:space:]]*["'\'']?(\./|runedeck/)' \
                      | grep -vE '@[0-9a-f]{40}["'\'']?$' || true)
                  if [ -n "$violations" ]; then
                      echo "Unpinned third-party actions:"
                      printf '%s\n' "$violations"
                      exit 1
                  fi
                  echo "All third-party actions pinned."

            - name: Release notes attestation
              if: github.event_name == 'pull_request'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # The fetch and the parse fail separately: an API or
                  # permission fault must not read as a missing section.
                  body=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.body // ""') \
                      || { echo "could not read the pull request body (API or permission failure)"; exit 1; }
                  printf '%s\n' "$body" \
                      | awk '/^## Release Notes[[:space:]]*$/{in_section=1; next} /^## /{in_section=0} in_section && /^([-*+]|[0-9]+[.)]) /{found=1} END{exit !found}' \
                      && echo "Release Notes section present." \
                      || { echo "The pull request body needs a '## Release Notes' section with at least one entry ('- N/A' for non-user-facing work)."; exit 1; }

            # The distro package is too old for `gitleaks git`; install the
            # pinned upstream release and verify it against the release's
            # published checksums before executing.
            # ruff and semgrep serve the universal prek config's type-gated
            # hooks; rust and ts toolchains are the scaffolded repository's
            # own concern, and their hooks never fire without their files.
            - name: Install tools
              run: |
                  sudo apt-get install -y shellcheck
                  pipx install ruff semgrep
                  curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
                  sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
                  tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
                  sudo install gitleaks /usr/local/bin/gitleaks

            # Runs before any step executes tree-configured commands. When a
            # prior manifest exists, pull requests use the base branch and
            # pushes use the previous head, so one change cannot weaken its own
            # checks. Initial adoption uses the new manifest.
            - name: Ceremony drift
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  [ -f .ceremony-manifest ] || { echo "manifest missing: ceremony repositories carry .ceremony-manifest"; exit 1; }
                  manifest_ref=HEAD
                  prior_ref=""
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                      prior_ref="${{ github.event.pull_request.base.sha }}"
                  elif [ -n "${{ github.event.before }}" ] \
                      && ! printf '%s' "${{ github.event.before }}" | grep -q '^0*$'; then
                      prior_ref="${{ github.event.before }}"
                  fi
                  if [ -n "$prior_ref" ]; then
                      # Fail closed: force-pushing main is refused by the base
                      # ruleset, so an unfetchable prior state is a CI anomaly
                      # to rerun, never a license to self-trust HEAD's manifest.
                      if ! git cat-file -e "$prior_ref^{commit}" 2>/dev/null \
                          && ! git fetch --no-tags --depth=1 origin "$prior_ref"; then
                          echo "Prior ceremony state is unavailable at $prior_ref; rerun with full history."
                          exit 1
                      fi
                      if git cat-file -e "$prior_ref:.ceremony-manifest" 2>/dev/null; then
                          manifest_ref="$prior_ref"
                      fi
                  fi
                  trusted_manifest=$(mktemp)
                  baseline=$(mktemp)
                  canonical_tree=$(mktemp)
                  canonical_paths=$(mktemp)
                  # One resolved commit pins the tree listing and every file
                  # fetch, so a skeleton push mid-check cannot desynchronize
                  # them.
                  canonical_sha=$(gh api "repos/runedeck/skeleton/commits/main" --jq '.sha') \
                      || { echo "Skeleton baseline is inaccessible."; exit 1; }
                  if ! gh api "repos/runedeck/skeleton/git/trees/$canonical_sha?recursive=1" > "$canonical_tree"; then
                      echo "Skeleton baseline is inaccessible."
                      exit 1
                  fi
                  jq -e '.truncated == false' "$canonical_tree" >/dev/null \
                      || { echo "Skeleton baseline tree is truncated."; exit 1; }
                  jq -r '.tree[] | select(.type == "blob") | .path' "$canonical_tree" > "$canonical_paths"
                  git show "$manifest_ref:.ceremony-manifest" > "$trusted_manifest" \
                      || { echo "Trusted ceremony manifest is unreadable at $manifest_ref."; exit 1; }
                  drifted=""
                  fetch_failed=""
                  checked=0
                  # One normalized entry list per manifest: membership tests and
                  # the union walk compare identical trimmed forms.
                  trusted_entries=$(mktemp)
                  union_entries=$(mktemp)
                  sed 's/^[[:space:]]*//; s/[[:space:]]*$//' "$trusted_manifest" \
                      | grep -v '^#' | grep -v '^$' | sort -u > "$trusted_entries"
                  sed 's/^[[:space:]]*//; s/[[:space:]]*$//' "$trusted_manifest" .ceremony-manifest \
                      | grep -v '^#' | grep -v '^$' | sort -u > "$union_entries"
                  # The union of the trusted and HEAD manifests: trusted entries
                  # stop a change from unlisting its own checks, and HEAD-only
                  # entries put newly added ceremony files under drift at once.
                  while IFS= read -r file || [ -n "$file" ]; do
                      # A trusted-listed file the skeleton no longer ships is
                      # retirement in progress, not drift. Without a trusted
                      # prior state, an entry the baseline lacks is junk.
                      if ! grep -Fxq "templates/base/$file" "$canonical_paths"; then
                          if [ "$manifest_ref" != "HEAD" ] && grep -Fxq "$file" "$trusted_entries"; then
                              echo "skipping $file: the skeleton baseline no longer ships it"
                          else
                              drifted="$drifted $file(baseline-missing)"
                          fi
                          continue
                      fi
                      # Only entries the baseline still ships count as checked:
                      # a manifest whose every entry is retired must not pass
                      # the lists-no-files guard on zero comparisons.
                      checked=$((checked + 1))
                      if [ ! -f "$file" ]; then
                          drifted="$drifted $file(missing)"
                          continue
                      fi
                      if ! gh api "repos/runedeck/skeleton/contents/templates/base/$file?ref=$canonical_sha" \
                          -H "Accept: application/vnd.github.raw" > "$baseline" 2>/dev/null; then
                          fetch_failed="$fetch_failed $file"
                          continue
                      fi
                      if ! diff -q "$baseline" "$file" >/dev/null; then
                          drifted="$drifted $file"
                      fi
                  done < "$union_entries"
                  if [ "$checked" -eq 0 ]; then
                      echo "Trusted ceremony manifest lists no files."
                      exit 1
                  fi
                  if [ -n "$fetch_failed" ]; then
                      echo "Baseline fetch failed, drift unknown for:$fetch_failed"
                      exit 1
                  fi
                  if [ -n "$drifted" ]; then
                      echo "Ceremony files drifted from the skeleton baseline:$drifted"
                      exit 1
                  fi
                  echo "Ceremony files match the skeleton baseline."

            - name: Commit-stage checks
              uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2

            # Scan exactly the commits this event introduces. The rangeless
            # fallback fires when no prior ref resolves, a first push or an
            # unfetchable before, and widens to the full tree, never narrower.
            - name: Pre-push-stage checks
              run: |
                  if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
                      from="${{ github.event.pull_request.base.sha }}"
                  elif [ -n "${{ github.event.before }}" ] && ! printf '%s' "${{ github.event.before }}" | grep -q '^0*$'; then
                      from="${{ github.event.before }}"
                  else
                      from=""
                  fi
                  if [ -n "$from" ] && git cat-file -e "$from" 2>/dev/null; then
                      prek run --stage pre-push --from-ref "$from" --to-ref "${{ github.sha }}"
                  else
                      prek run --stage pre-push --all-files
                  fi
