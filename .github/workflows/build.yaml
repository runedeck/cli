name: Build

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Build
              run: cargo build --release

            - name: Upload binary
              uses: actions/upload-artifact@v7
              with:
                  name: rune
                  path: target/release/rune

    dashboard:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy

            - name: Build dashboard feature in isolation
              run: cargo build --no-default-features --features dashboard

            - name: Clippy dashboard
              run: cargo clippy --features dashboard -- -D warnings

            - name: Test dashboard
              run: cargo test --features dashboard

    quality:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Download rune
              uses: actions/download-artifact@v8
              with:
                  name: rune
                  path: /usr/local/bin

            - name: Install tools
              run: |
                  chmod +x /usr/local/bin/rune
                  sudo apt-get install -y gitleaks
                  pip install semgrep

            - name: Validate
              uses: j178/prek-action@v2

    # End-to-end guard: scaffold a fresh module via `rune init` and run
    # `make validate` against it. Catches any change that produces a broken
    # init template (CLI-shape drift, stale SHA pins, Makefile typos, etc.).
    scaffold:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Download rune
              uses: actions/download-artifact@v8
              with:
                  name: rune
                  path: /usr/local/bin

            - name: Install prek
              uses: taiki-e/install-action@v2
              with:
                  tool: prek

            - name: Scaffold and validate generated module
              shell: bash
              run: |
                  set -euo pipefail
                  chmod +x /usr/local/bin/rune
                  /usr/local/bin/rune init --target /tmp/module
                  cd /tmp/module
                  git init -q
                  make validate
