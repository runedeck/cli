name: Build

# The jobs need only checkout reads; nothing here writes through the token.
permissions:
    contents: read

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# The prek hooks call `gitleaks git`, which needs a release build; the
# Ubuntu package predates that subcommand.
env:
    GITLEAKS_VERSION: "8.30.1"

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  persist-credentials: false

            - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
              with:
                  components: rustfmt, clippy

            - name: Build
              run: cargo build --release

            - name: Upload binary
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: rune
                  path: target/release/rune

    dashboard:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  persist-credentials: false

            - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
              with:
                  components: clippy

            - name: Install mdschema
              run: |
                  bash scripts/install-mdschema.sh "$RUNNER_TEMP/bin"
                  echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

            - name: Build dashboard feature in isolation
              run: cargo build --no-default-features --features dashboard

            - name: Clippy dashboard
              run: cargo clippy --features dashboard -- -D warnings

            - name: Test dashboard
              run: cargo test --features dashboard

    quality:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  persist-credentials: false

            - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
              with:
                  components: rustfmt, clippy

            - name: Install mdschema
              run: |
                  bash scripts/install-mdschema.sh "$RUNNER_TEMP/bin"
                  echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

            - name: Download rune
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: rune
                  path: /usr/local/bin

            - name: Install tools
              run: |
                  chmod +x /usr/local/bin/rune
                  pip install semgrep
                  curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
                  sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
                  tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
                  sudo install gitleaks /usr/local/bin/gitleaks

            - name: Validate
              uses: j178/prek-action@e98a699c41eb69ab013a45817a0406469a748f8d # v2

    # End-to-end guard: scaffold a fresh project via `rune init` and run
    # `make validate` against it. Catches any change that produces a broken
    # init template (CLI-shape drift, stale SHA pins, Makefile typos, etc.).
    scaffold:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  persist-credentials: false

            - name: Download rune
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: rune
                  path: /usr/local/bin

            - name: Install prek
              uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
              with:
                  tool: prek

            - name: Install validation tools
              run: |
                  pip install semgrep
                  curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
                  sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
                  tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
                  sudo install gitleaks /usr/local/bin/gitleaks

            - name: Scaffold and validate generated project
              shell: bash
              run: |
                  set -euo pipefail
                  chmod +x /usr/local/bin/rune
                  /usr/local/bin/rune init /tmp/module --with rust,tool --brief "scaffold smoke test"
                  cd /tmp/module
                  git init -q
                  make validate
