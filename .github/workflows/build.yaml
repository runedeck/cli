name: Build

# The jobs need only checkout reads; nothing here writes through the token.
permissions:
    contents: read

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  persist-credentials: false

            - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
              with:
                  components: rustfmt, clippy

            - name: Build
              run: cargo build --release

            - name: Upload binary
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: rune
                  path: target/release/rune

    dashboard:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  persist-credentials: false

            - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
              with:
                  components: clippy

            - name: Install mdschema
              run: |
                  bash scripts/install-mdschema.sh "$RUNNER_TEMP/bin"
                  echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

            - name: Build dashboard feature in isolation
              run: cargo build --no-default-features --features dashboard

            - name: Clippy dashboard
              run: cargo clippy --features dashboard -- -D warnings

            - name: Test dashboard
              run: cargo test --features dashboard

    quality:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  persist-credentials: false

            - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
              with:
                  components: rustfmt, clippy

            - name: Download rune
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: rune
                  path: /usr/local/bin

            # The same pinned tools the local hooks and the quality workflow
            # use, ruff included; the inline installs this replaced had no ruff.
            - name: Install tools
              run: |
                  chmod +x /usr/local/bin/rune
                  bash scripts/install-tools

            - name: Validate
              run: prek run --all-files

    # End-to-end guard: scaffold a fresh project via `rune init` and run
    # `make validate` against it. Catches any change that produces a broken
    # init template (CLI-shape drift, stale SHA pins, Makefile typos, etc.).
    scaffold:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  persist-credentials: false

            - name: Download rune
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: rune
                  path: /usr/local/bin

            - name: Install tools
              run: bash scripts/install-tools

            - name: Scaffold and validate generated project
              shell: bash
              run: |
                  set -euo pipefail
                  chmod +x /usr/local/bin/rune
                  /usr/local/bin/rune init /tmp/module --with rust,tool --brief "scaffold smoke test"
                  cd /tmp/module
                  git init -q
                  make validate
