name: Review Correctness

# Thin caller: the lane's body lives in runedeck/seer. The caller owns
# the triggers, the concurrency, and the permissions; only review-label
# events and new pushes may cancel an active run, so an unrelated label
# never kills a billed review mid-flight.
on:
    pull_request:
        types: [opened, ready_for_review, reopened, synchronize, labeled, unlabeled]

permissions:
    contents: read
    pull-requests: write
    issues: write
    id-token: write
    actions: read
    checks: read

concurrency:
    group: review-correctness-${{ github.event.pull_request.number }}
    cancel-in-progress: ${{ !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) || github.event.label.name == 'review' || github.event.label.name == 'review:runeseer' }}

jobs:
    review:
        uses: runedeck/seer/.github/workflows/review-correctness.yaml@main
        secrets:
            RUNESEER_APP_ID: ${{ secrets.RUNESEER_APP_ID }}
            RUNESEER_APP_KEY: ${{ secrets.RUNESEER_APP_KEY }}
            CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    # Mirrors the called lane's result under the stable check context the
    # rulesets and the canon name.
    review-context:
        name: review/correctness
        needs: review
        if: always() && needs.review.result != 'skipped'
        runs-on: ubuntu-latest
        timeout-minutes: 2
        steps:
            - run: |
                  [ "${{ needs.review.result }}" = "success" ] && exit 0
                  echo "the lane concluded: ${{ needs.review.result }}"
                  exit 1
