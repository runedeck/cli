name: Review Correctness

# Thin caller: the lane's body lives in runedeck/seer. The caller owns
# the triggers, the concurrency, and the permissions. The controller
# invites the paid lane on a same-repository pull request's green head,
# draft or ready, from the first push. The body's triage stands it down
# before any spend, and the work item's paid budget bounds the rounds. A body edit rebuilds the ledger and starts no round. Review
# labels force a round, while stage labels record settled work. Applying
# or removing a review label, or pushing, cancels an active run: a round
# on a moved head is void before its model call. Other label changes do
# not cancel. The lane consumes labels with the workflow token when a
# round ends, and those removals emit no events, so a clean round never
# re-enters here. A new review comment runs only the mirror, which stales
# the approval on a thread the ledger never saw.
# pull_request_target, deliberately: the caller executes from the base branch,
# so a pull request cannot rewrite the reviewer, the mirror, or the secret
# wiring that judges its own head. The body checks out the judged head
# explicitly and strips its instruction surfaces before the model reads it.
on:
    pull_request_target:
        types:
            - opened
            - reopened
            - synchronize
            - converted_to_draft
            - labeled
            - unlabeled
            - ready_for_review
            - edited
    pull_request_review_comment:
        types:
            - created

permissions:
    contents: read
    pull-requests: write
    issues: write
    id-token: write
    actions: read
    checks: read

concurrency:
    group: review-correctness-${{ github.event.pull_request.number }}
    cancel-in-progress: ${{ github.event.action == 'synchronize' || (contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && contains(fromJSON('["review", "review:macroscope", "review:runeseer"]'), github.event.label.name)) }}

jobs:
    # The controller runs on every push to a same-repository pull request,
    # draft or ready, on open and reopen, on a body edit (ledger rebuild
    # only), on the ready flip, and on the owner's review:runeseer label.
    # The green draft starts the funnel: the paid round runs before the
    # owner's first key touch, and the open-seal then attests a reviewed
    # head. Fork pull requests reach the controller through a label only. Its triage stands the paid lane
    # down before any spend. skip:runeseer is checked here as well, so the
    # lane is never invoked and no runner is spent standing it down. The
    # mirror then records the skipped lane.
    review:
        if: '!cancelled() && github.event_name == ''pull_request_target'' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, ''skip:runeseer'') && ((github.event.action == ''labeled'' && github.event.label.name == ''review:runeseer'') || github.event.action == ''opened'' || github.event.action == ''synchronize'' || github.event.action == ''reopened'' || github.event.action == ''edited'' || github.event.action == ''ready_for_review'')'
        # A pull request must not modify the reviewer that judges the same head.
        uses: runedeck/seer/.github/workflows/review-correctness.yaml@main
        secrets:
            RUNESEER_APP_ID: ${{ secrets.RUNESEER_APP_ID }}
            RUNESEER_APP_KEY: ${{ secrets.RUNESEER_APP_KEY }}
            CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    # Mirrors the called lane's result under the stable check context the
    # rulesets require. Fail-closed: a head the lane did not judge reports
    # failure rather than skipping, because a skipped check satisfies a
    # required status check, and it runs for drafts too so a label applied
    # in draft can never leave a skipped-green check behind. The ledger is
    # the record: green means a verdict bound to this head and generation
    # with Runeseer's approval standing, or a recorded stand-down whose
    # coverage state is printed. A thread the ledger never saw, a moved
    # generation, or an edited body stales the approval, and the mirror
    # dismisses it.
    review-context:
        name: review/correctness
        needs: review
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 2
        steps:
            - env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  PR: ${{ github.event.pull_request.number }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  RUN_ID: ${{ github.run_id }}
                  REVIEW_RESULT: ${{ needs.review.result }}
                  LEDGER_PREFIX: runeseer-ledger-pr
              run: |
                  set -o pipefail
                  # A red mirror names what it saw: the lane job, and the verdict
                  # when one exists for this head. A missing verdict marks a lane
                  # fault rather than a judgment, and each case states its retry.
                  verdict_comments() {
                      gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
                          --jq '[.[] | select(.user.login == "runeseer[bot]") | select(.body | contains("<!-- runeseer-verdict sha=" + env.HEAD_SHA + " base=" + env.BASE_SHA + " round="))]' \
                          | jq -s 'add // []'
                  }
                  latest_machine_verdict() {
                      verdict_comments | jq -r '
                          [.[]
                              | . as $comment
                              | try (.body | capture("round=(?<round>[0-9]+) verdict=(?<verdict>clean|findings)( restart=(?<restart>none|cursor|macroscope))?( generation=(?<generation>[0-9]+))? -->")) catch null
                              | select(. != null)
                              | {round: (.round | tonumber), verdict, restart: (.restart // "none"), updated_at: $comment.updated_at, id: $comment.id}]
                          | sort_by(.round, .updated_at, .id)
                          | last // {}
                          | "\(.verdict // ""):\(.restart // "")"'
                  }
                  # The newest ledger for this head, trusted by the run that
                  # uploaded it: this workflow, from the base branch, for this
                  # pull request. Writes the ledger to $ledger and prints one
                  # of: none, other-head, stale:late-thread, stale:body,
                  # stale:generation, unjudged:<generation>, free:<coverage>,
                  # bound:<generation>. Returns 1 on an API failure.
                  ledger="$RUNNER_TEMP/runeseer-ledger.json"
                  ledger_state() {
                      candidates=$(gh api --paginate "repos/$REPO/actions/artifacts?name=${LEDGER_PREFIX}${PR}&per_page=100" \
                          --jq '[.artifacts[] | select(.expired == false)]' \
                          | jq -s -r 'add // [] | sort_by(.created_at) | reverse | .[] | "\(.id)|\(.workflow_run.id)"') || return 1
                      found=false
                      for candidate in $candidates; do
                          artifact_id=${candidate%%|*}
                          uploader=${candidate#*|}
                          run=$(gh api "repos/$REPO/actions/runs/$uploader") || return 1
                          jq -e --argjson pr "$PR" '
                              .event == "pull_request_target"
                              and ([.pull_requests[]?.number] | index($pr) != null)' <<<"$run" >/dev/null || continue
                          gh api "repos/$REPO/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/ledger.zip" || return 1
                          unzip -p "$RUNNER_TEMP/ledger.zip" runeseer-ledger.json > "$ledger" 2>/dev/null || continue
                          jq -e --argjson pr "$PR" '.schema == 1 and .pull_request == $pr' "$ledger" >/dev/null || continue
                          found=true
                          break
                      done
                      [ "$found" = "true" ] || { echo "none"; return 0; }
                      [ "$(jq -r '.reviewed_sha' "$ledger")" = "$HEAD_SHA" ] || { echo "other-head"; return 0; }
                      thread_query='query($owner: String!, $repo: String!, $number: Int!, $endCursor: String) {
                          repository(owner: $owner, name: $repo) {
                              pullRequest(number: $number) {
                                  reviewThreads(first: 100, after: $endCursor) {
                                      pageInfo { hasNextPage endCursor }
                                      nodes { id }
                                  }
                              }
                          }
                      }'
                      gh api graphql --paginate -f query="$thread_query" \
                          -f owner="${REPO%/*}" -f repo="${REPO#*/}" -F number="$PR" \
                          --jq '[.data.repository.pullRequest.reviewThreads.nodes[].id]' \
                          | jq -s 'add // []' > "$RUNNER_TEMP/thread-ids.json" || return 1
                      late=$(jq --slurpfile live "$RUNNER_TEMP/thread-ids.json" \
                          '[.threads[].id] as $known | [$live[0][] | select(. as $id | $known | index($id) | not)] | length' "$ledger")
                      body_digest=$(gh api "repos/$REPO/pulls/$PR" --jq '.body // ""' | sha256sum | cut -d' ' -f1) || return 1
                      generation=$(jq -r '.generation' "$ledger")
                      verdict_generation=$(jq -r '.verdict.generation // ""' "$ledger")
                      coverage=$(jq -r '.coverage // ""' "$ledger")
                      if [ "$late" != "0" ]; then
                          echo "stale:late-thread"
                      elif [ "$body_digest" != "$(jq -r '.body_digest // ""' "$ledger")" ]; then
                          echo "stale:body"
                      elif [ -n "$verdict_generation" ] && [ "$verdict_generation" != "$generation" ]; then
                          echo "stale:generation"
                      elif [ -n "$verdict_generation" ]; then
                          echo "bound:$generation"
                      elif [ "${coverage#free lanes only}" != "$coverage" ]; then
                          echo "free:$coverage"
                      else
                          echo "unjudged:$generation"
                      fi
                  }
                  # A stale approval is withdrawn: the earned approval binds to
                  # (reviewed_sha, generation), and the generation moved.
                  dismiss_stale_approval() {
                      review_id=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews?per_page=100" \
                          --jq '[.[] | select(.user.login == "runeseer[bot]" and .commit_id == env.HEAD_SHA and .state == "APPROVED")]' \
                          | jq -s -r 'add // [] | sort_by(.submitted_at) | last | .id // empty') || return 0
                      [ -n "$review_id" ] || return 0
                      gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$review_id/dismissals" \
                          -f message="$1" -f event=DISMISS >/dev/null \
                          && echo "dismissed the stale approval (review $review_id)" \
                          || echo "could not dismiss the stale approval; the check holds the merge"
                  }
                  explain_lane_failure() {
                      conclusion="$1"
                      job_url=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
                          --jq '[.jobs[] | select(.name == "review / correctness")]' \
                          | jq -s -r 'add // [] | first // empty | .html_url // ""') || job_url=""
                      verdict_line=$(verdict_comments \
                          | jq -r 'last // empty | "\(.body | split("\n") | map(select(startswith("**"))) | first // (.body | split("\n") | first)) (\(.html_url))"') || verdict_line=""
                      echo "the lane concluded: $conclusion"
                      [ -n "$job_url" ] && echo "lane job: $job_url"
                      if [ -n "$verdict_line" ]; then
                          echo "latest verdict for this head: $verdict_line"
                          echo "push a fix and apply review:runeseer to start a new round"
                      else
                          echo "no verdict exists for this head: the lane faulted before judging; rerun this workflow or apply review:runeseer for a fresh round"
                      fi
                  }
                  # Read live overrides before the mirror decides. A failed
                  # label read must not read as an applied override.
                  labels=$(gh api --paginate "repos/$REPO/issues/$PR/labels?per_page=100" \
                      --jq '[.[].name]' | jq -s -r 'add // [] | .[]') \
                      || { echo "could not read the live labels; rerun the check"; exit 1; }
                  # skip: means the lane is out of scope for this pull request,
                  # so it clears whatever else happened.
                  if printf '%s\n' "$labels" | grep -qx 'skip:runeseer'; then
                      echo "skip:runeseer present; this lane is out of scope for this pull request."
                      exit 0
                  fi
                  # ignore:runeseer cannot hide a failed current round. It can
                  # release only a prior judgment when no new round ran.
                  if [ "$REVIEW_RESULT" != "success" ] && [ "$REVIEW_RESULT" != "skipped" ]; then
                      explain_lane_failure "$REVIEW_RESULT"
                      exit 1
                  fi
                  # ignore: releases a judged lane, never a broken one. Every
                  # completed round posts exactly one summary whose first line
                  # carries the head it judged, and it posts that summary
                  # whether the verdict was clean or not, so it is the one
                  # signal present for any judgment and absent for a fault. A
                  # review is not: the lane emits one only when it comments
                  # inline or approves, so a round of carried or Low findings
                  # leaves none.
                  if printf '%s\n' "$labels" | grep -qx 'ignore:runeseer'; then
                      judged=$(verdict_comments | jq -r 'length') \
                          || { echo "could not read the pull request comments; rerun the check"; exit 1; }
                      if [ "$judged" != "0" ]; then
                          echo "ignore:runeseer present and this head carries a Runeseer verdict summary; the owner accepted its findings."
                          exit 0
                      fi
                      echo "ignore:runeseer present, but no Runeseer verdict exists for this head; a lane that never judged is broken, not ignored."
                      exit 1
                  fi
                  # A reusable workflow whose inner job skips its guard still
                  # concludes success, so a successful caller result defers to
                  # the inner job's own conclusion. A failed jobs read fails
                  # this check, and an unknown conclusion stays red. A green
                  # inner job proves nothing by itself: the ledger decides.
                  if [ "$REVIEW_RESULT" = "success" ]; then
                      inner=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
                          --jq '[.jobs[] | select(.name == "review / correctness")]' \
                          | jq -s -r 'add // [] | first | .conclusion // "missing"') \
                          || { echo "could not read this run's jobs; rerun the check"; exit 1; }
                      if [ "$inner" != "success" ] && [ "$inner" != "skipped" ]; then
                          explain_lane_failure "$inner"
                          exit 1
                      fi
                  fi
                  live=$(gh api "repos/$REPO/pulls/$PR" --jq '[.head.sha, .base.sha] | @tsv') \
                      || { echo "could not read the live pull request; rerun the check"; exit 1; }
                  if [ "$live" != "$HEAD_SHA"$'\t'"$BASE_SHA" ]; then
                      echo "the pull request head or base changed; start a new review round"
                      exit 1
                  fi
                  state=$(ledger_state) \
                      || { echo "could not read the ledger for this head; rerun the check"; exit 1; }
                  case "$state" in
                      stale:late-thread)
                          echo "a review thread arrived after the ledger was built; the approval is stale."
                          echo "push a fix or apply review:runeseer for one more adjudication on this head"
                          dismiss_stale_approval "A review thread arrived after the verdict; the ledger generation moves and the approval is stale."
                          exit 1
                          ;;
                      stale:body)
                          echo "the pull request body changed after the ledger was built; the approval is stale until the ledger rebuilds."
                          dismiss_stale_approval "The pull request body changed after the verdict; the approval is stale."
                          exit 1
                          ;;
                      stale:generation)
                          echo "the ledger generation moved past the verdict's; the approval is stale until a re-adjudication."
                          dismiss_stale_approval "The ledger generation moved past the verdict's; the approval is stale."
                          exit 1
                          ;;
                      free:*)
                          echo "the paid lane stood down; coverage: ${state#free:}"
                          echo "This green check records the coverage state, not a clean verdict."
                          exit 0
                          ;;
                      unjudged:*)
                          echo "the ledger records no verdict at generation ${state#unjudged:}; coverage: $(jq -r '.coverage // "not triaged"' "$ledger")"
                          echo "a round is pending or the lane faulted; rerun this workflow or apply review:runeseer"
                          exit 1
                          ;;
                  esac
                  # Per-page jq output merges through jq -s: the runner's gh
                  # predates --slurp. pipefail keeps a failed reviews read from
                  # reading as an absent approval.
                  latest_state=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews?per_page=100" \
                      --jq '[.[] | select(.user.login == "runeseer[bot]" and .commit_id == env.HEAD_SHA)]' \
                      | jq -s -r 'add // [] | sort_by(.submitted_at) | last | .state // ""') \
                      || { echo "could not read the pull request reviews; rerun the check"; exit 1; }
                  machine_verdict=$(latest_machine_verdict) \
                      || { echo "could not read the current Runeseer verdict; rerun the check"; exit 1; }
                  if [ "$latest_state" = "APPROVED" ] && [ "$machine_verdict" = "clean:none" ]; then
                      case "$state" in
                          bound:*)
                              echo "Runeseer's latest review approves this head at ledger generation ${state#bound:}; coverage: paid."
                              exit 0
                              ;;
                      esac
                      echo "Runeseer's latest review approves this head, but no trusted ledger binds it (ledger: $state)."
                      exit 1
                  fi
                  echo "no standing clean Runeseer verdict for this head and base (ledger: $state); apply the review label to start a round"
                  exit 1
