name: Review Cascade

# Thin caller: the review cascade lives in runedeck/seer. pull_request_target,
# deliberately: the cascade is API-only and checks out nothing, and fork pull
# requests need the base-context secrets. Never add a head checkout here
# or in the body.
on:
    pull_request_target:
        types: [labeled]

permissions:
    contents: read
    checks: read
    pull-requests: read
    issues: write

concurrency:
    group: review-cascade-${{ github.event.pull_request.number }}
    cancel-in-progress: ${{ github.event.label.name == 'review' }}

jobs:
    review:
        if: github.event.pull_request.draft == false && github.event.label.name == 'review'
        uses: runedeck/seer/.github/workflows/review-cascade.yaml@main
        secrets:
            RUNEWRIGHT_APP_ID: ${{ secrets.RUNEWRIGHT_APP_ID }}
            RUNEWRIGHT_APP_KEY: ${{ secrets.RUNEWRIGHT_APP_KEY }}
            # Cursor ignores bot-authored requests; the cascade posts them
            # with this owner-minted token instead.
            RUNEWRIGHT_GITHUB_TOKEN: ${{ secrets.RUNEWRIGHT_GITHUB_TOKEN }}
