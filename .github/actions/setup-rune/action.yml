name: Setup Rune
description: Download and cache the rune CLI binary from GitHub releases

inputs:
    version:
        description: "Version to install (e.g., v0.3.0 or latest)"
        default: "latest"
    token:
        description: "GitHub token for API requests (avoids rate limits)"
        default: ${{ github.token }}

outputs:
    version:
        description: "Installed rune version"
        value: ${{ steps.resolve.outputs.version }}
    cache-hit:
        description: "Whether the binary was restored from cache"
        value: ${{ steps.cache.outputs.cache-hit }}

runs:
    using: composite
    steps:
        - name: Resolve version
          id: resolve
          shell: bash
          env:
              GH_TOKEN: ${{ inputs.token }}
              REQUESTED: ${{ inputs.version }}
          run: |
              if [ "$REQUESTED" = "latest" ]; then
                  VERSION=$(gh api repos/runedeck/rune/releases/latest --jq '.tag_name')
              else
                  VERSION="$REQUESTED"
              fi
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "Resolved rune version: $VERSION"

        - name: Determine archive name
          id: archive
          shell: bash
          run: |
              case "$RUNNER_OS-$RUNNER_ARCH" in
                  Linux-X64)   ARCHIVE="rune-cli-linux-x86_64.tar.gz" ;;
                  macOS-ARM64) ARCHIVE="rune-cli-macos-aarch64.tar.gz" ;;
                  Windows-X64) ARCHIVE="rune-cli-windows-x86_64.zip" ;;
                  *) echo "Unsupported platform: $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
              esac
              echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

        - name: Cache rune binary
          id: cache
          uses: actions/cache@v4
          with:
              path: ~/.cache/rune-cli
              key: rune-${{ steps.resolve.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

        - name: Download rune
          if: steps.cache.outputs.cache-hit != 'true'
          shell: bash
          env:
              GH_TOKEN: ${{ inputs.token }}
              VERSION: ${{ steps.resolve.outputs.version }}
              ARCHIVE: ${{ steps.archive.outputs.archive }}
          run: |
              mkdir -p ~/.cache/rune-cli
              gh release download "$VERSION" \
                  --repo runedeck/rune \
                  --pattern "$ARCHIVE" \
                  --dir /tmp
              if [[ "$ARCHIVE" == *.zip ]]; then
                  unzip -o "/tmp/$ARCHIVE" -d ~/.cache/rune-cli
              else
                  tar xzf "/tmp/$ARCHIVE" -C ~/.cache/rune-cli
              fi
              chmod +x ~/.cache/rune-cli/rune*

        - name: Add to PATH
          shell: bash
          run: echo "$HOME/.cache/rune-cli" >> "$GITHUB_PATH"
