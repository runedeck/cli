name: Quality

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: quality-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Install tools
              run: sudo apt-get install -y gitleaks shellcheck

            - name: Commit-stage checks
              uses: j178/prek-action@v2

            - name: Pre-push-stage checks
              run: prek run --all-files --stage pre-push
