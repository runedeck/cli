name: Review Cascade

# Thin caller: the review cascade lives in runedeck/seer. pull_request_target,
# deliberately: the cascade is API-only and checks out nothing, and fork pull
# requests need the base-context secrets. Never add a head checkout here
# or in the body.
#
# The ready event, each later push, and a reopen all reach the controller
# (docs/specs/review-requests, Ready Starts the Funnel): its triage decides
# whether a paid round starts, and the called workflow reads the event from
# github.event, which a reusable workflow shares with its caller. The
# `review` label stays as the owner's way to force a round. Until the
# controller carries a triage, the called workflow stands down without a
# live `review` label, so the wider trigger spends nothing today.
on:
    pull_request_target:
        types: [labeled, unlabeled, ready_for_review, synchronize, reopened]

# The body uses the workflow token to read check runs, the live head, and
# review threads. PR label changes need pull-requests: write and issues: write.
# Workflow-token label removal emits no event and cannot cancel the lane.
permissions:
    contents: read
    checks: read
    pull-requests: write
    issues: write

# A fresh review request replaces the active cascade.
# Label removal cannot cancel a round after dispatch.
concurrency:
    group: review-cascade-${{ github.event.pull_request.number }}
    cancel-in-progress: ${{ github.event.action == 'labeled' && github.event.label.name == 'review' }}

jobs:
    # Fork pull requests keep the owner-summoned free lanes: a review
    # label on a fork head runs the cascade, the correctness lane
    # refuses fork heads on its own, and the ordered workflow stops
    # after the free lanes (docs/specs/lane-configuration/spec.md, Fork
    # pull request scenario). A draft never starts a round: the free
    # lanes and the deterministic checks run on it through their own
    # workflows.
    cascade:
        if: github.event.pull_request.draft == false && ((github.event.action == 'labeled' && github.event.label.name == 'review') || contains(fromJSON('["ready_for_review", "synchronize", "reopened"]'), github.event.action))
        uses: runedeck/seer/.github/workflows/review-cascade.yaml@main
        with:
            macroscope_correctness_check: ${{ vars.MACROSCOPE_CORRECTNESS_CHECK }}
        secrets:
            RUNEWRIGHT_APP_ID: ${{ secrets.RUNEWRIGHT_APP_ID }}
            RUNEWRIGHT_APP_KEY: ${{ secrets.RUNEWRIGHT_APP_KEY }}
