name: Review Cascade

# Thin caller: the review cascade lives in runedeck/seer. pull_request_target,
# deliberately: the cascade is API-only and checks out nothing, and fork pull
# requests need the base-context secrets. Never add a head checkout here
# or in the body.
on:
    pull_request_target:
        types: [labeled, unlabeled, ready_for_review]

# The body's reads (check runs, the live head, review threads) ride the
# workflow token; issues: write lets it also consume labels on that
# token, whose events trigger nothing and so can never cancel a lane.
permissions:
    contents: read
    checks: read
    pull-requests: read
    issues: write

# A fresh bare review summon or its removal may cancel a cascade. Every other
# label re-enters this group without interrupting the active round.
concurrency:
    group: review-cascade-${{ github.event.pull_request.number }}
    cancel-in-progress: ${{ contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && github.event.label.name == 'review' }}

jobs:
    review:
        if: github.event.pull_request.draft == false && (github.event.action == 'labeled' || (github.event.action == 'ready_for_review' && contains(github.event.pull_request.labels.*.name, 'review')))
        uses: runedeck/seer/.github/workflows/review-cascade.yaml@main
        secrets:
            RUNEWRIGHT_APP_ID: ${{ secrets.RUNEWRIGHT_APP_ID }}
            RUNEWRIGHT_APP_KEY: ${{ secrets.RUNEWRIGHT_APP_KEY }}
            # Cursor ignores bot-authored summons; the cascade posts them
            # with this owner-minted token instead.
            RUNEWRIGHT_GITHUB_TOKEN: ${{ secrets.RUNEWRIGHT_GITHUB_TOKEN }}
