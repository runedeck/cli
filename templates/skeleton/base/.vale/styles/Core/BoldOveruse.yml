# Deslop (rule): bold on every key term is a machine tell. Two bold runs
# in one paragraph are a skimming aid; the third is decoration. A script,
# because Vale strips the markers before any scope but raw, and raw is the
# whole file, so an occurrence rule cannot count per paragraph.
extends: script
message: "More than two bold runs in one paragraph. Keep bold for what a reader skims for (rule Deslop)."
level: suggestion
scope: raw
script: |
  text := import("text")
  matches := []
  offset := 0
  for para in text.split(scope, "\n\n") {
    runs := text.re_find(`\*\*[^*\n]+\*\*`, para, -1)
    if runs != undefined && len(runs) > 2 {
      for run in runs[2:] {
        matches = append(matches, {begin: offset + run[0].begin, end: offset + run[0].end})
      }
    }
    offset += len(para) + 2
  }
