repos:
    - repo: builtin
      hooks:
          - id: trailing-whitespace
          - id: check-yaml
            exclude: ^templates/
          - id: check-json

    - repo: local
      hooks:
          - id: shellcheck
            name: shellcheck
            entry: shellcheck -S warning
            language: system
            types: [shell]

          - id: ruff
            name: ruff check
            entry: ruff check
            language: system
            types: [python]

          - id: gitleaks
            name: gitleaks (staged)
            entry: gitleaks git --staged --pre-commit --no-banner
            language: system
            pass_filenames: false

          - id: gitleaks-tree
            name: gitleaks (push range)
            entry: gitleaks git --no-banner --log-opts "HEAD --not --remotes" .
            language: system
            pass_filenames: false
            stages: [pre-push]

          - id: semgrep
            name: semgrep OWASP
            entry: semgrep scan --config=p/owasp-top-ten --metrics=off --quiet .
            language: system
            pass_filenames: false
            stages: [pre-push]

          - id: rune-validate
            name: rune validate
            entry: rune validate
            language: system
            pass_filenames: false
