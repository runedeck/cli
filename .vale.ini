StylesPath = .vale/styles
MinAlertLevel = warning

# The STE style is generated from the Simplified Technical English rule
# source by scripts/generate-vale-style.py. Edit the source, regenerate,
# never edit the generated files. Fenced and inline code are never linted.
# Every rule is sentence-scoped, so YAML front matter is not linted.
# Blockquotes are prose: captured output belongs in a fence.
# The strict-mode words render at suggestion level; run
# `vale --minAlertLevel=suggestion` to see them without failing a check.

[*.md]
BasedOnStyles = STE

# The embedded skeleton is a template payload, and the skill template is a
# scaffold with placeholders. Neither is this repository's prose.
[templates/**/*.md]
BasedOnStyles =
