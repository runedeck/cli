StylesPath = .vale/styles
MinAlertLevel = warning

# The STE style is generated from the Simplified Technical English rule
# source by scripts/generate-vale-style.py. Edit the source, regenerate,
# never edit the generated files. Fenced and inline code are never linted.
# Every rule is sentence-scoped, so YAML front matter is not linted.
# Blockquotes are prose: captured output belongs in a fence.
# STE advises and never fails a run: semicolons, contractions, and an
# overused word (gate, arm, knob, surface) warn, one vocabulary swap is
# a suggestion. Run `vale --minAlertLevel=suggestion` to see the swaps.

# Core mirrors the deck's prose rules: no em dash, negative parallelism,
# an undefined jargon term, bold density, and AI vocabulary. NoEmDash is
# the one error, so it is the one rule that fails a run or blocks a write
# in the lint hook. UndefinedTerm is generated from the same word list as
# STE.Overused*; the other Core files are hand-written.

[*.md]
BasedOnStyles = STE, Core

# The embedded skeleton is a template payload, and the skill template is a
# scaffold with placeholders. Neither is this repository's prose.
[templates/**/*.md]
BasedOnStyles =

# ASSEMBLY-0012 is a reviewed adoption of forge-core PROV-0006. Its prose is
# upstream text under a sealed digest; only its links were adapted.
[docs/decisions/ASSEMBLY-0012*.md]
STE.Semicolons = NO
Core.NoEmDash = NO
