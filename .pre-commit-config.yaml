# One universal config for every scaffolded repository: each hook gates on
# the file types present in the change, so hooks for absent languages never
# fire and language templates carry no lint config of their own.
repos:
    - repo: builtin
      hooks:
          # Everything under .provenance/ is sealed, digest-bound evidence:
          # an auto-fixing hook that rewrites it destroys what it touches.
          # Validators and secret scanning still cover it.
          - id: trailing-whitespace
            exclude: '(^|/)\.provenance/'
          - id: check-yaml
            exclude: ^templates/
          - id: check-json

    - repo: local
      hooks:
          - id: shellcheck
            name: shellcheck
            entry: shellcheck -S warning
            language: system
            types: [shell]

          - id: ruff
            name: ruff check
            entry: ruff check .
            language: system
            pass_filenames: false
            types: [python]

          - id: cargo-fmt
            name: cargo fmt
            entry: cargo fmt --check
            language: system
            pass_filenames: false
            types: [rust]

          - id: cargo-clippy
            name: cargo clippy
            entry: cargo clippy --all-targets --all-features -- -D warnings
            language: system
            pass_filenames: false
            types: [rust]

          - id: tsc
            name: tsc --noEmit
            entry: npx tsc --noEmit
            language: system
            pass_filenames: false
            types: [ts]

          - id: gitleaks
            name: gitleaks (staged)
            entry: gitleaks git --staged --pre-commit --no-banner
            language: system
            pass_filenames: false
            stages: [pre-commit]

          - id: rune-validate
            name: rune validate
            entry: sh -c 'if command -v rune >/dev/null 2>&1 && { [ -f module.yaml ] || [ -f deck.yaml ] || [ -f .rune ]; }; then rune validate; fi'
            language: system
            pass_filenames: false

          - id: cargo-test
            name: cargo test
            entry: cargo test --all-features
            language: system
            pass_filenames: false
            types: [rust]
            stages: [pre-push]

          - id: semgrep
            name: semgrep OWASP
            entry: semgrep scan --config=p/owasp-top-ten --metrics=off --quiet .
            language: system
            pass_filenames: false
            stages: [pre-push]

          - id: gitleaks-range
            name: gitleaks (push range)
            entry: sh -c 'if [ -n "${PRE_COMMIT_FROM_REF:-}" ]; then gitleaks git --no-banner --log-opts "${PRE_COMMIT_FROM_REF}..${PRE_COMMIT_TO_REF:-HEAD}"; else gitleaks git --no-banner; fi'
            language: system
            pass_filenames: false
            stages: [pre-push]
