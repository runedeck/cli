# Secret declaration for the launch-secret-declaration-lookup proof. home.sh
# copies it to .config/rune/secretspec.toml, the default declaration. The
# stub bin/secretspec answers in place of secretspec, so no provider runs.
[project]
name = "proof"
revision = "1.0"

[profiles.default]
PROOF_ORIGIN = { description = "The value the probe profiles read" }
