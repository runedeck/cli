# A rune user config for the Cursor proofs, the `home` config with two
# changes: `jev` adds context on tool.after and turn.finish, so a switch
# on it shows in two events, and `trace` observes tool.before beside
# `dcg`, the one guard, so the event stays when the guard is off.
hooks:
  version: 1
  events:
    tool.before: {budget_ms: 3000}
  handlers:
    - id: dcg
      exec: [sh, -c, 'cat > dcg.json; grep -q "rm -rf" dcg.json && printf "%s" "{\"effect\":\"deny\",\"reason\":\"no rm -rf\"}" || printf "%s" "{}"']
      events: [tool.before]
      order: 20
      timeout_ms: 1000
      on_failure: deny
      requires: [tool_deny]
    - id: trace
      exec: [sh, -c, 'cat > trace.json; printf "%s" "{}"']
      events: [tool.before, tool.after]
      order: 25
      timeout_ms: 500
    - id: jev
      exec: [sh, -c, 'cat > /dev/null; printf "%s" "{\"context\":[\"jev: one finding\"]}"']
      events: [tool.after, turn.finish]
      order: 20
      timeout_ms: 5000
    - id: session-capture
      exec: [sh, -c, 'cat > capture.json; printf "%s" "{}"']
      events: [session.end, compact.before]
      order: 30
      timeout_ms: 300
    - id: turn-checkpoint
      exec: [sh, -c, 'cat > /dev/null; printf "%s" "{}"']
      events: [prompt.before, turn.finish, session.end]
      order: 40
      timeout_ms: 150
    - id: tmux-status
      exec: [sh, -c, 'cat > /dev/null; printf "%s" "{}"']
      events: [prompt.before, notification, turn.finish, session.end]
      order: 50
      timeout_ms: 50
