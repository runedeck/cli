# typos configuration. KEYS holds base64 key material. Sidecars and
# third-party notices are not this repository's prose.
[files]
extend-exclude = [
    "*.asc",
    ".provenance",
    ".claude",
    ".codex",
    ".gemini",
    ".opencode",
    "**/THIRD_PARTY_NOTICES.md",
    # Vendored minified dashboard assets and signing fixtures are not prose.
    "static/dashboard/vendor",
    "src/cli/sign/fixtures",
    # Recorded casts carry escape sequences that run into words.
    "docs/proofs/*/proof.cast",
]

[default]
# Mermaid node identifiers such as BA in fenced diagrams, hex object ids
# (a jj short commit id in a recorded proof transcript is eight hex
# characters), the gpg colon-listing record tag, the wrap-test fragment
# in the comment panel tests, and the one misspelling the hook record
# fixtures and proof scenes carry on purpose so the lint hook has a typo
# to count.
extend-ignore-re = ["[A-Z]{2} ?-->", "--> ?[A-Z]{2}", "[A-Z]{2}\\[", "\"fpr\"", "fpr:{9}", "[0-9a-f]{8,}", "\" worl\"", "refernce"]

[default.extend-words]
# The TUI crate and the skateboarding fixture are spelled as upstream spells them.
ratatui = "ratatui"
tre = "tre"
unparseable = "unparseable"

# Reference-style link labels in adopted decision records. ASSEMBLY-0012 is
# upstream prose under a sealed digest and cannot be reworded here.
[default.extend-identifiers]
INTOTO = "INTOTO"
