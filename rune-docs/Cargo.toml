[package]
name = "rune-docs"
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"
description = "Documentation lifecycle for rune: docs link checks, ADRs, and spec-driven changes"
repository = "https://github.com/runedeck/cli"

[lib]
name = "rune_docs"
path = "src/lib.rs"

[features]
default = []
# The whole spec module: lifecycle commands, the read-only scans, tree
# validation, and OpenSpec interop. links, adr, and the support helpers are
# always compiled.
lifecycle = ["dep:clap", "dep:sha2"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
console = "0.15"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
