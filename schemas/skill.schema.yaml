$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required:
    - name
    - description
properties:
    name:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    description:
        type: string
        maxLength: 1024
    license:
        type: string
    compatibility:
        type: string
        maxLength: 500
    metadata:
        type: object
        additionalProperties:
            type: string
    allowed-tools:
        type: string
