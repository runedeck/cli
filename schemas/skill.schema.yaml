$schema: https://json-schema.org/draft/2020-12/schema
type: object
required:
    - name
    - description
    - version
properties:
    name:
        type: string
        # agentskills.io: skill names are lowercase letters, digits, and hyphens.
        # The Claude Code loader rejects any other form, so validate it here.
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    description:
        type: string
    version:
        type: string
    targets:
        type: array
        items:
            type: string
