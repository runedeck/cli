$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required:
    - name
    - description
properties:
    name:
        type: string
        minLength: 1
        maxLength: 64
        # Source is authored in whatever casing a deck prefers, and providers
        # deploy that casing verbatim. A provider whose specification demands
        # lowercase names (agentskills) enables the kebab-case-skills assembly
        # rule to normalize on the way out. What must hold in source is that
        # the directory, this field, and the H1 agree, which lint_skill checks.
        pattern: "^[A-Za-z0-9]+([-_]?[A-Za-z0-9]+)*$"
    description:
        type: string
        maxLength: 1024
    license:
        type: string
    compatibility:
        type: string
        maxLength: 500
    metadata:
        type: object
        additionalProperties:
            type: string
    allowed-tools:
        type: string
    targets:
        type: array
        items:
            type: string
    # Who may invoke the skill. The claude provider already carries both
    # fields through assembly, so rejecting them here refused a skill the
    # deployed harness reads. `disable-model-invocation` keeps a skill out
    # of the model's listing, leaving it a slash command only;
    # `user-invocable: false` hides it from the menu, leaving it background
    # knowledge the model loads on its own.
    disable-model-invocation:
        type: boolean
    user-invocable:
        type: boolean
