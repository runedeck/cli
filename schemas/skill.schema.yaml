$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required:
    - name
    - description
properties:
    name:
        type: string
        minLength: 1
        maxLength: 64
        # Source is authored in whatever casing a deck prefers; the kebab-case
        # assembly rule normalizes it on the way out. What must hold in source
        # is that the directory, this field, and the H1 agree, which lint_skill
        # checks. A deck that deploys without that rule keeps its own casing.
        pattern: "^[A-Za-z0-9]+([-_]?[A-Za-z0-9]+)*$"
    description:
        type: string
        maxLength: 1024
    license:
        type: string
    compatibility:
        type: string
        maxLength: 500
    metadata:
        type: object
        additionalProperties:
            type: string
    allowed-tools:
        type: string
