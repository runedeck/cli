# Identities for the ci/authorship check. Two lists, two policies.
#
# authors: valid as the commit author, and as a Co-Authored-By trailer.
# The author field MUST match one entry exactly. Model identities carry
# the model id in parentheses and a non-routable per-model address.
#
# trailers: valid ONLY as a Co-Authored-By trailer, never as the author.
# These are the attribution lines coding harnesses append to the commit
# message. They form a second provenance channel: the author names who
# made the commit, the trailer names who helped or which tool assisted.
# Keeping them separate means a wrong author field can never validate
# through a trailer alias.
